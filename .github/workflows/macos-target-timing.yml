name: Time a cold Exact macOS desktop build
on:
  push:
    branches: [ci/macos-target-timing]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: blacksmith-8vcpu-ubuntu-2604
    timeout-minutes: 22
    defaults:
      run:
        shell: bash
    env:
      BENCHMARK_TARGET: macos
      EXACT_FAST_UBUNTU_MIRROR: 1
      EXACT_FEEDBACK: '0'
      EXACT_IDENTITY: '-'
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CONVEX_ORIGIN: ws://127.0.0.1:3210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: pin
        run: cat .github/actions/exact-setup/pin.env >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ steps.pin.outputs.bun-version }}
          no-cache: true
      - uses: actions/checkout@v7.0.1
        with:
          repository: expo/exact
          ref: ${{ steps.pin.outputs.exact-ref }}
          path: .exact-sdk
          persist-credentials: false
      - name: Prepare Exact and the cross compiler
        run: |
          set -euo pipefail
          export EXACT="$GITHUB_WORKSPACE/.exact-sdk"
          git -C "$EXACT" apply "$GITHUB_WORKSPACE/.github/scripts/hosted-mobile/macos-cross.patch"
          git -C "$EXACT" apply "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/ios-contacts-compat.patch"
          (cd "$EXACT" && bun install --frozen-lockfile)
          mkdir -p apps/apps/.exact
          ln -s "$EXACT" apps/apps/.exact/checkout
          (cd apps/apps && bun install --frozen-lockfile)
          bash .github/scripts/hosted-mobile/toolchain.sh & tools=$!
          bash .github/scripts/hosted-mobile/prepare-apple-exact.sh macos bootstrap & rust=$!
          status=0
          wait "$tools" || status=$?
          wait "$rust" || status=$?
          test "$status" = 0
          echo "EXACT=$EXACT" >> "$GITHUB_ENV"
      - name: Install the pinned macOS SDK
        run: bash .github/scripts/hosted-mobile/install-public-sdk.sh macos
      - name: Build and verify the macOS desktop app
        working-directory: apps/apps
        run: |
          set -euo pipefail
          tools=$(mktemp -d "$RUNNER_TEMP/mac-commands.XXXXXX")
          cat > "$tools/xcrun" <<'XCRUN'
          #!/usr/bin/env bash
          exec bun "$EXACT/host/apple/toolchain.mjs" "$@"
          XCRUN
          chmod +x "$tools/xcrun"
          export PATH="$tools:$PATH"
          xcrun --sdk macosx --show-sdk-path
          export CARGO_TARGET_DIR
          CARGO_TARGET_DIR=$(mktemp -d "$RUNNER_TEMP/cargo-mac.XXXXXX")
          start=$SECONDS
          bun exact.mjs mac --release --json > "$RUNNER_TEMP/mac-result.json"
          elapsed=$(( SECONDS - start ))
          bundle=$(jq -er '.path' "$RUNNER_TEMP/mac-result.json")
          binary=$(python3 - "$bundle" <<'PY_CHECK'
          from pathlib import Path
          import plistlib
          import sys

          contents = Path(sys.argv[1]) / "Contents"
          plist = plistlib.loads((contents / "Info.plist").read_bytes())
          assert plist["CFBundleIdentifier"] == "dev.disposabl.fresh.traveldesk"
          print(contents / "MacOS" / plist["CFBundleExecutable"])
          PY_CHECK
          )
          llvm-lipo "$binary" -verify_arch arm64
          llvm-objdump --macho --private-headers "$binary" > "$RUNNER_TEMP/mac-build-version"
          grep -Eiq '^[[:space:]]*platform[[:space:]]+(macos|1)[[:space:]]*$' "$RUNNER_TEMP/mac-build-version"
          rcodesign print-signature-info --config-file /dev/null "$binary" > "$RUNNER_TEMP/mac-signature"
          grep -q 'CodeSignatureFlags(.*ADHOC' "$RUNNER_TEMP/mac-signature"
          grep -Eq '^[[:space:]]*cms: null[[:space:]]*$' "$RUNNER_TEMP/mac-signature"
          printf 'Verified an arm64 macOS .app from Ubuntu. Build took %ss.\n' "$elapsed"
          printf 'Cold Travel Desk macOS desktop build on Ubuntu: **%ss**\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
